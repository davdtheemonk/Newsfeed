name: iOS 14 Compatibility Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-ios14:
    runs-on: macos-14 # Use macOS 14 runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install iOS 14 Simulator
        run: |
          # List available runtimes first
          xcrun simctl runtime list
          # Install iOS 14.5 simulator runtime (last iOS 14 version)
          xcodebuild -downloadPlatform iOS -version 14.5 || true

      - name: Build for iOS 14 Simulator
        run: |
          cd ios
          pod install
          xcodebuild build \
            -workspace NewsFeed.xcworkspace \
            -scheme NewsFeed \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,OS=14.5,name=iPhone 12' \
            CODE_SIGNING_ALLOWED=NO
